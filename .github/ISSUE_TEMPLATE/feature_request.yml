name: Feature request
description: Suggest one focused improvement
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Problem or use case
      description: What would this help you accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include compatibility impact and simpler alternatives, if relevant.
    validations:
      required: true
