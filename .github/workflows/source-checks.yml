name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ARM64 / source tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Source and script checks
        shell: bash
        run: |
          set -euo pipefail
          git show --format= --check HEAD
          python3 tools/check-public-source.py
          zsh -n tools/build-dev-app.sh
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('tools/bundle-runtime.py').read_text()); ast.parse(pathlib.Path('tests/test_cli.py').read_text())"
          grep -q 'PolyForm Noncommercial License 1.0.0' LICENSE

      - name: Swift UI typecheck
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library -typecheck -swift-version 5 \
            apps/macos/MacRemoteApp.swift \
            apps/macos/MacRemoteDelegate.swift \
            apps/macos/MacRemoteMenu.swift \
            apps/macos/ServerController.swift \
            apps/macos/BandwidthModeSettings.swift \
            apps/macos/ListenPortSettings.swift \
            apps/macos/DisplayModels.swift \
            apps/macos/DisplayModeService.swift \
            apps/macos/DisplayModeOperations.swift \
            apps/macos/DisplayConfigurationStore.swift \
            apps/macos/ClientDevicePreferences.swift \
            apps/macos/DisplayOutputSettings.swift \
            apps/macos/EditableResolutionComboBox.swift \
            apps/macos/ServerRestartPolicy.swift

      - name: Port and bandwidth preference regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -parse-as-library -swift-version 5 \
            apps/macos/ListenPortSettings.swift tests/test_port_settings.swift \
            -o "$RUNNER_TEMP/test-port-settings"
          "$RUNNER_TEMP/test-port-settings"
          xcrun swiftc -O -parse-as-library -swift-version 5 \
            apps/macos/BandwidthModeSettings.swift tests/test_bandwidth_mode_settings.swift \
            -o "$RUNNER_TEMP/test-bandwidth-mode-settings"
          "$RUNNER_TEMP/test-bandwidth-mode-settings"

      - name: Display preferences and restart regression
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -O -parse-as-library -swift-version 5 \
            apps/macos/DisplayModels.swift \
            apps/macos/DisplayModeService.swift \
            apps/macos/DisplayModeOperations.swift \
            apps/macos/DisplayConfigurationStore.swift \
            apps/macos/ClientDevicePreferences.swift \
            apps/macos/BandwidthModeSettings.swift \
            apps/macos/DisplayOutputSettings.swift \
            tests/test_display_output_settings.swift \
            -o "$RUNNER_TEMP/test-display"
          "$RUNNER_TEMP/test-display"
          xcrun swiftc -O -parse-as-library -swift-version 5 \
            apps/macos/ServerController.swift apps/macos/BandwidthModeSettings.swift \
            apps/macos/ListenPortSettings.swift \
            apps/macos/ServerRestartPolicy.swift tests/test_server_restart_policy.swift \
            -o "$RUNNER_TEMP/test-restart"
          "$RUNNER_TEMP/test-restart"

      - name: Karabiner compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -x objective-c \
            tests/test_karabiner_compat.m src/input/karabiner_compat.m \
            -framework ApplicationServices -framework AppKit \
            -framework Foundation -framework Carbon -framework IOKit \
            -o "$RUNNER_TEMP/test-karabiner"
          "$RUNNER_TEMP/test-karabiner"

# Source checks only. Do not upload license-incompatible developer binaries.
